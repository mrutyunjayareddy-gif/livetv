<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TV Channels Player</title>
    
    <!-- Libraries for HLS and DASH support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }
        #menu {
            position: fixed;
            left: 0;
            top: 80px;
            bottom: 0;
            width: 200px;
            overflow-y: auto;
            border-right: 1px solid #333;
            background-color: #111;
        }
        #menu div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            color: #ccc;
            font-size: 15px;
            transition: background 0.2s;
        }
        #menu div:hover {
            background: #222;
        }
        #menu div.active {
            background: #1b73e8;
            color: #fff;
            font-weight: bold;
        }
        #player {
            position: fixed;
            left: 200px;
            top: 0;
            width: calc(100% - 200px);
            height: 100%;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="menu"></div>

<div id="player">
    <video id="video" controls autoplay muted playsinline></video>
</div>

<script>
    const channels = [
        ["ETV Cinema", "https://d27zlkxhgwrfgo.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_CINEMA_H264_cloud_in/index.m3u8"],
        ["ETV Andhra", "https://d1g35elx8qnif3.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_AP_H264_cloud_in/index.m3u8"],
        ["ETV Telangana", "https://d37d7pfp7vjqhh.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_TS_H264_cloud_in/index.m3u8"],
        ["ETV News", "https://cc-3448kp65yhc5w.akamaized.net/WWBI/Amagi/ETV_News_IN/playlist.m3u8"],
        ["ETV Comedy", "https://cc-wie8j8y69d2uy.akamaized.net/WWBI/Amagi/ETV_Comedy_IN/playlist.m3u8"],
        ["ETV Plus", "https://d12ee3o8yfkkhd.cloudfront.net/c6a4b411295f47f48c908d2ac0605bad/index.m3u8"],
        ["ETV Abhiruchi", "https://dg3721c3ez5m0.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_ABHIRUCHI_H264_cloud-in/index.m3u8"],
        ["ETV Josh", "https://cc-uyh1ow5zouoio.akamaized.net/WWBI/Amagi/ETV_Josh_IN/playlist.m3u8"],
        ["ETV Music", "https://cc-szivnms4rlah6.akamaized.net/WWBI/Amagi/ETV_Music_IN/playlist.m3u8"],
        ["ETV Telugu", "https://d27zlkxhgwrfgo.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_HD_H264_cloud_in/index.m3u8"],
        ["TV9", "https://dyjmyiv3bp2ez.cloudfront.net/pub-iotv9telcmjhcs/liveabr/playlist.m3u8"],
        ["NTV", "https://mumbai-edge.smartplaytv.in/NTVTelugu/index.m3u8"],
        ["Sakshi", "https://cdn-1.pishow.tv/live/409/master.m3u8"],
        ["DD Saptagiri", "https://d2lk5u59tns74c.cloudfront.net/out/v1/26e915d6d12b4a06822c5e33c088ed56/index.m3u8"],
        ["DD Yadagiri", "https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/c89fa6d6f5864ac29670d6f91cb7e32a/index.m3u8"],
        ["ABN Andra Jyothi", "https://mumbai-edge.smartplaytv.in/ABNAJ/index.m3u8"],
        ["Space Live", "https://linear-1224.frequency.stream/dist/lg-uk/1224/hls/master/playlist.m3u8"],
        ["BBC", "https://vs-cmaf-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/hevc_iptv_mse_v0.mpd"]
    ];

    const video = document.getElementById("video");
    const menu = document.getElementById("menu");
    let hls = null;
    let dashPlayer = null;

    // Initialize DASH polyfills
    shaka.polyfill.installAll();

    async function play(index) {
        const url = channels[index][1];
        const isDash = url.endsWith('.mpd');

        // Cleanup existing instances
        if (hls) {
            hls.destroy();
            hls = null;
        }
        if (dashPlayer) {
            await dashPlayer.destroy();
            dashPlayer = null;
        }
        video.src = "";

        // 1. Logic for DASH (.mpd) - e.g., BBC
        if (isDash) {
            dashPlayer = new shaka.Player(video);
            try {
                await dashPlayer.load(url);
                video.play().catch(() => {});
            } catch (e) {
                console.error("DASH error", e);
            }
        } 
        // 2. Logic for HLS (.m3u8) - e.g., ETV
        else if (Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {});
            });
        } 
        // 3. Native fallback (Safari/iOS)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(() => {});
            });
        }

        // Update UI active state
        Array.from(menu.children).forEach((item, i) => {
            item.className = (i === index) ? "active" : "";
        });
    }

    // Build the menu
    channels.forEach((channel, i) => {
        let item = document.createElement("div");
        item.innerText = channel[0];
        item.onclick = () => play(i);
        menu.appendChild(item);
    });

    // Auto play first channel
    window.onload = () => {
        setTimeout(() => play(0), 500);
    };
</script>

</body>
</html>
